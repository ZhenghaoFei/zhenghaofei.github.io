<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 880px;
            width: 92%;
            margin: 0 auto;
            padding: 4rem 0;
            color: #222;
            line-height: 1.7;
            font-size: 16px;
        }
        a { color: #0366d6; text-decoration: none; }
        a:hover { text-decoration: underline; }
        h1 {
            font-size: 1.9rem;
            margin: 0 0 0.5rem 0;
            font-weight: 700;
        }
        h2 {
            font-size: 1.05rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #666;
            margin: 3rem 0 1rem 0;
            padding-bottom: 0.35rem;
            border-bottom: 1px solid #e5e5e5;
        }
        p { margin: 0.6rem 0; }
        ul { padding-left: 1.2rem; margin: 0.6rem 0; }
        li { margin-bottom: 0.5rem; }
        .muted { color: #777; }
        .subtitle { color: #555; margin-top: 0; }
        .links { margin: 1rem 0 0 0; }
        .links a { margin-right: 1rem; }
        .item { margin-bottom: 1.1rem; }
        .item .role { font-weight: 600; }
        .item .where { color: #555; }
        .item .when { color: #777; font-size: 0.9rem; }
        .list-row { display: flex; justify-content: space-between; gap: 1rem; margin-bottom: 0.55rem; }
        .list-row .date { color: #777; font-size: 0.9rem; white-space: nowrap; }
        @media (max-width: 560px) {
            body { padding: 2.5rem 0; }
        }
    </style>
</head>
<body>
    {{ content }}
</body>
</html>
