<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 880px;
            width: 92%;
            margin: 0 auto;
            padding: 4rem 0;
            color: #222;
            line-height: 1.7;
            font-size: 16px;
        }
        a { color: #0366d6; text-decoration: none; }
        a:hover { text-decoration: underline; }
        h1 {
            font-size: 1.9rem;
            margin: 0 0 0.5rem 0;
            font-weight: 700;
        }
        h2 {
            font-size: 1.05rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #666;
            margin: 3rem 0 1rem 0;
            padding-bottom: 0.35rem;
            border-bottom: 1px solid #e5e5e5;
        }
        p { margin: 0.6rem 0; }
        ul { padding-left: 1.2rem; margin: 0.6rem 0; }
        li { margin-bottom: 0.5rem; }
        .muted { color: #777; }
        .subtitle { color: #555; margin-top: 0; }
        .links { margin: 1rem 0 0 0; }
        .links a { margin-right: 1rem; }
        .item { margin-bottom: 1.1rem; }
        .item .role { font-weight: 600; }
        .item .where { color: #555; }
        .item .when { color: #777; font-size: 0.9rem; }
        .list-row { display: flex; justify-content: space-between; gap: 1rem; margin-bottom: 0.55rem; }
        .list-row .date { color: #777; font-size: 0.9rem; white-space: nowrap; }
        img { max-width: 100%; height: auto; display: block; margin: 1.2rem auto 0.4rem auto; }
        h3 { font-size: 1.1rem; margin: 2rem 0 0.6rem 0; }
        blockquote {
            margin: 1.2rem 0;
            padding: 0.2rem 1.2rem;
            border-left: 3px solid #d0d0d0;
            color: #555;
            background: #fafafa;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 1.2rem 0;
            font-size: 0.9rem;
            display: block;
            overflow-x: auto;
        }
        th, td { border: 1px solid #e0e0e0; padding: 0.4rem 0.7rem; }
        th { background: #f6f6f6; text-align: left; }
        tr:nth-child(even) td { background: #fafafa; }
        code {
            background: #f2f2f2;
            padding: 0.1em 0.35em;
            border-radius: 4px;
            font-size: 0.88em;
        }
        pre {
            background: #f6f8fa;
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            padding: 0.9rem 1rem;
            overflow-x: auto;
            font-size: 0.82rem;
            line-height: 1.5;
        }
        pre code { background: none; padding: 0; font-size: inherit; }
        hr { border: none; border-top: 1px solid #e5e5e5; margin: 2.5rem 0; }
        details {
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            padding: 0.5rem 1rem;
            margin: 0.8rem 0;
        }
        details summary { cursor: pointer; }
        details summary:hover { color: #0366d6; }
        @media (max-width: 560px) {
            body { padding: 2.5rem 0; }
        }
    </style>
</head>
<body>
    {{ content }}
</body>
</html>
